<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zero-Sum Car Game Replay</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1a1a1a;
        color: #eee;
      }
      header {
        padding: 0.75rem 1rem;
        background: #242424;
        border-bottom: 1px solid #333;
      }
      h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
      .sub { margin: 0.25rem 0 0; font-size: 0.85rem; color: #aaa; }
      .p1 { color: #e74c3c; }
      .p2 { color: #3498db; }
      main { display: flex; flex-wrap: wrap; gap: 0; }
      #canvas-wrap {
        flex: 1 1 520px;
        min-width: 320px;
        min-height: 480px;
        height: min(72vh, 720px);
        position: relative;
      }
      #canvas-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      aside {
        flex: 0 0 280px;
        padding: 1rem;
        background: #242424;
        border-left: 1px solid #333;
      }
      button {
        display: block;
        width: 100%;
        margin-bottom: 0.5rem;
        padding: 0.55rem 0.75rem;
        border: 1px solid #444;
        border-radius: 6px;
        background: #333;
        color: #eee;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:hover { background: #3d3d3d; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .btn-row button {
        flex: 1;
        margin-bottom: 0;
      }
      #stats {
        margin-top: 1rem;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #bbb;
      }
      #error { color: #f66; margin-top: 0.75rem; font-size: 0.85rem; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <header>
      <h1>Zero-Sum Car Game</h1>
      <p class="sub">
        <span class="p1">Player 1</span> maximizes ·
        <span class="p2">Player 2</span> minimizes · minimax DQN rollout
      </p>
    </header>
    <main>
      <div id="canvas-wrap"></div>
      <aside>
        <button id="btn-play" type="button">Play rollout</button>
        <div class="btn-row">
          <button id="btn-back" type="button">← Back</button>
          <button id="btn-forward" type="button">Forward →</button>
        </div>
        <button id="btn-random" type="button">New random start</button>
        <button id="btn-corners" type="button">Corners (0,0) vs (4,4)</button>
        <div id="stats">Loading weights…</div>
        <div id="error"></div>
      </aside>
    </main>
    <script type="module">
      import { loadWeights } from "../qnetwork.js";
      import { createCarEnv } from "./environment.js";
      import { rolloutDetailed } from "./policy.js";
      import { CarReplayRenderer } from "./renderer.js";

      const GRID_SIZE = 5;
      const HORIZON = 20;
      const WEIGHTS_URL = "/cargame_zerosum/weights_player1.json";

      const statsEl = document.getElementById("stats");
      const errorEl = document.getElementById("error");
      const canvasWrap = document.getElementById("canvas-wrap");
      const btnPlay = document.getElementById("btn-play");
      const btnBack = document.getElementById("btn-back");
      const btnForward = document.getElementById("btn-forward");
      const btnRandom = document.getElementById("btn-random");
      const btnCorners = document.getElementById("btn-corners");

      let renderer = null;
      let model = null;
      let currentRollout = { traj: [], steps: [] };
      let currentInfo = null;
      let currentStep = 0;
      let env = null;
      let starts = [];
      let startIdx = 0;

      function setButtonsEnabled(enabled) {
        btnPlay.disabled = !enabled;
        btnRandom.disabled = !enabled;
        btnCorners.disabled = !enabled;
        if (enabled) {
          updateStepButtons();
        } else {
          btnBack.disabled = true;
          btnForward.disabled = true;
        }
      }

      function updateStepButtons() {
        const maxStep = currentRollout.traj.length - 1;
        btnBack.disabled = currentStep <= 0;
        btnForward.disabled = currentStep >= maxStep;
      }

      async function goToStep(step, { animate = false } = {}) {
        if (!currentRollout.traj.length) return;
        renderer.stopPlayback();
        const maxStep = currentRollout.traj.length - 1;
        const target = Math.max(0, Math.min(step, maxStep));

        if (target === currentStep) {
          updateStepButtons();
          return;
        }

        const from = currentRollout.traj[currentStep];
        const to = currentRollout.traj[target];
        const isSingleStep = Math.abs(target - currentStep) === 1;

        if (animate && isSingleStep) {
          setButtonsEnabled(false);
          try {
            await renderer.animateStep(from, to, 450);
          } finally {
            currentStep = target;
            if (currentInfo) {
              updateStats(currentInfo, currentStep);
            }
            setButtonsEnabled(true);
          }
          return;
        }

        currentStep = target;
        renderer.setCars(to);
        if (currentInfo) {
          updateStats(currentInfo, currentStep);
        }
        updateStepButtons();
      }

      function stepForward() {
        goToStep(currentStep + 1, { animate: true }).catch((err) => {
          errorEl.textContent = err.message;
          setButtonsEnabled(true);
        });
      }

      function stepBack() {
        goToStep(currentStep - 1, { animate: true }).catch((err) => {
          errorEl.textContent = err.message;
          setButtonsEnabled(true);
        });
      }

      function fmt(n) {
        return n.toFixed(3);
      }

      function scoreAtState(state) {
        return {
          p1Grid: env.cellGridReward(state[0], state[1]),
          p2Grid: env.cellGridReward(state[2], state[3]),
          p1Dist: env.manhattanToCenter(state[0], state[1]),
          p2Dist: env.manhattanToCenter(state[2], state[3]),
        };
      }

      function summarize(traj, startState) {
        const moves = traj.length - 1;
        let p1Moves = 0;
        let p2Moves = 0;
        for (let i = 0; i < traj.length - 1; i++) {
          const s = traj[i];
          const sn = traj[i + 1];
          if (s[0] !== sn[0] || s[1] !== sn[1]) p1Moves++;
          if (s[2] !== sn[2] || s[3] !== sn[3]) p2Moves++;
        }
        const crashed = env.isCollision(traj[traj.length - 1]);
        return {
          startState,
          moves,
          p1Moves,
          p2Moves,
          unique: new Set(traj.map((s) => s.join(","))).size,
          crashed,
        };
      }

      function updateStats(info, step = 0) {
        const s = info.startState;
        const state = currentRollout.traj[step] ?? currentRollout.traj[0];
        const scores = scoreAtState(state);
        const stepInfo = step > 0 ? currentRollout.steps[step - 1] : null;
        const lastReward = stepInfo ? stepInfo.reward : null;
        const cumulative = stepInfo ? stepInfo.cumulativeReward : 0;

        statsEl.innerHTML = `
          <div><strong>Start:</strong> P1 (${s[0]},${s[1]}) · P2 (${s[2]},${s[3]})</div>
          <div><strong>Step:</strong> ${step} / ${info.moves}</div>
          <hr style="border:0;border-top:1px solid #444;margin:0.6rem 0">
          <div><strong>Scores (training rewards)</strong></div>
          <div><span class="p1">P1 cell value:</span> ${fmt(scores.p1Grid)} <span style="color:#888">(dist ${scores.p1Dist})</span></div>
          <div><span class="p2">P2 cell value:</span> ${fmt(scores.p2Grid)} <span style="color:#888">(dist ${scores.p2Dist})</span></div>
          <div><strong>Step reward:</strong> ${lastReward === null ? "—" : fmt(lastReward)}</div>
          <div><strong>Cumulative (P1&nbsp;↑ / P2&nbsp;↓):</strong> ${fmt(cumulative)}</div>
          <hr style="border:0;border-top:1px solid #444;margin:0.6rem 0">
          <div><strong>Total moves:</strong> ${info.moves}</div>
          <div><span class="p1">P1 moves:</span> ${info.p1Moves}</div>
          <div><span class="p2">P2 moves:</span> ${info.p2Moves}</div>
          <div><strong>Unique states:</strong> ${info.unique}</div>
          <div><strong>Ended in crash:</strong> ${info.crashed ? "yes" : "no"}</div>
          <p style="color:#888;font-size:0.78rem;margin:0.5rem 0 0">
            Cell value = grid reward from Manhattan distance to center.
            Zero-sum step reward also includes living cost and stay penalties.
          </p>
        `;
      }

      function runRollout(startState) {
        renderer?.stopPlayback();
        currentRollout = rolloutDetailed(env, model, startState, HORIZON);
        currentInfo = summarize(currentRollout.traj, startState);
        currentStep = 0;
        updateStats(currentInfo, 0);
        renderer.setCars(startState);
        renderer.drawTrail(currentRollout.traj);
        updateStepButtons();
        return currentInfo;
      }

      async function play() {
        if (!currentRollout.traj.length) return;
        renderer.stopPlayback();
        setButtonsEnabled(false);
        const info = currentInfo ?? summarize(currentRollout.traj, currentRollout.traj[0]);
        await renderer.playTrajectory(currentRollout.traj, 450, (step) => {
          currentStep = step;
          updateStats(info, step);
          updateStepButtons();
        });
        setButtonsEnabled(true);
      }

      btnPlay.addEventListener("click", () => {
        play().catch((err) => {
          errorEl.textContent = err.message;
          setButtonsEnabled(true);
        });
      });
      btnBack.addEventListener("click", stepBack);
      btnForward.addEventListener("click", stepForward);
      btnRandom.addEventListener("click", () => {
        startIdx = Math.floor(Math.random() * starts.length);
        runRollout(starts[startIdx]);
      });
      btnCorners.addEventListener("click", () => {
        startIdx = starts.findIndex(
          (s) => s[0] === 0 && s[1] === 0 && s[2] === 4 && s[3] === 4,
        );
        if (startIdx < 0) startIdx = 0;
        runRollout(starts[startIdx]);
      });

      async function init() {
        setButtonsEnabled(false);
        try {
          env = createCarEnv(GRID_SIZE);
          starts = env.allValidStartStates();
          startIdx = starts.findIndex(
            (s) => s[0] === 0 && s[1] === 0 && s[2] === 4 && s[3] === 4,
          );
          if (startIdx < 0) startIdx = 0;

          renderer = new CarReplayRenderer(canvasWrap, GRID_SIZE);
          model = await loadWeights(WEIGHTS_URL);
          errorEl.textContent = "";
          runRollout(starts[startIdx]);
          setButtonsEnabled(true);
        } catch (err) {
          console.error(err);
          errorEl.textContent = err.message;
          statsEl.textContent = "Failed to initialize. Check the browser console.";
        }
      }

      init();
    </script>
  </body>
</html>
